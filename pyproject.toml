[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".venv",
    "node_modules",
    "premanand-ji-website",
    "data",
    ".git",
    "__pycache__",
    "eval",
    "*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function calls in argument defaults (standard FastAPI Depends)
    "SIM108",  # Use ternary operator instead of `if`-`else`-block
    "UP042",  # Class inherits from both str and enum.Enum (compatible across Python versions)
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

